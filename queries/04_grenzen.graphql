# ─────────────────────────────────────────────────────────────
# 04_grenzen.graphql
# Leitfrage: „Was kann dieses System nicht – und was brauchen wir?"
# Zeigt: Grenze von Stufe 2, Lösung in Stufe 3, Übergang
# ─────────────────────────────────────────────────────────────


# ── Stufe 2 · relatedTo – was zurückkommt ────────────────────
# relatedTo liefert rohe Objekte mit id und relation –
# KEIN verschachteltes Contact-Objekt dahinter
{
  Contact(id: "6") {
    name
    relatedTo
  }
}
# Ergebnis: relatedTo: [{"id": 8, "relation": "Partner"}, ...]
# Problem:  Aus der ID 8 kann kein Name abgefragt werden.
#           Dafür wäre eine zweite Abfrage nötig (N+1-Problem).


# ── Stufe 2 · N+1 manuell ────────────────────────────────────
# Schritt 1: IDs holen
{
  Contact(id: "6") {
    name
    relatedTo
  }
}
# Schritt 2: Für jede ID einzeln nachfragen
{
  Contact(id: "8") { name }
}
{
  Contact(id: "7") { name }
}
# → Das skaliert nicht. Bei 50 Kontakten: 50 Abfragen.


# ── Stufe 3 · Selbstreferentielle Traversierung ───────────────
# Alles in einer Abfrage – kein N+1
{
  contact(id: 6) {
    name
    relatedTo {
      relation
      contact {
        name
        organization
        groups { name }
      }
    }
  }
}


# ── Stufe 3 · Tiefe Traversierung (mehrere Ebenen) ───────────
# Kontakt → relatedTo → deren relatedTo
{
  contact(id: 6) {
    name
    relatedTo {
      relation
      contact {
        name
        relatedTo {
          relation
          contact {
            name
          }
        }
      }
    }
  }
}


# ── Stufe 3 · REST parallel ──────────────────────────────────
# Gleiche Daten, anderes Zugriffsmodell:
#
#   GET http://localhost:8000/contacts/6
#   GET http://localhost:8000/contacts?name=Solo
#   GET http://localhost:8000/groups
#   GET http://localhost:8000/docs   ← Swagger UI
#
# GraphQL: Client bestimmt, welche Felder er braucht.
# REST:    Server definiert, was eine Antwort enthält.
# → Beide Modelle, eine Codebasis, eine Datenbasis.


# ── Didaktische Zusammenfassung ───────────────────────────────
#
# Stufe 1 · YAML
#   + Jeder versteht es
#   - Keine Abfragen, keine Beziehungen, keine Validierung
#
# Stufe 2 · json-graphql-server
#   + Schema automatisch, sofort abfragbar
#   - Implizites Schema (kein explizites Modell)
#   - Selbstreferenz nicht traversierbar
#   - Kein Typsystem (metWhen bleibt String)
#
# Stufe 3 · Strawberry + FastAPI
#   + Explizites Schema → klare Verantwortung
#   + Selbstreferenz traversierbar
#   + REST und GraphQL parallel
#   - Mehr Code, mehr Pflege
#
# → „Daten speichern ist einfach.
#    Daten strukturiert, traversierbar und sicher nutzbar machen
#    – das ist das eigentliche Informationssystem."
